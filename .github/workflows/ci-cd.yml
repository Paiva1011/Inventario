name: CI/CD

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # INTEGRACION CONTINUA: compila y corre TODAS las pruebas
  # (con un MySQL temporal, para que tambien pase contextLoads)
  # ---------------------------------------------------------------
  test:
    name: CI - Compilar y probar
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventario_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/inventario_db
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso a mvnw
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # ENTREGA CONTINUA: solo en master o al crear un tag vX.Y.Z
  # ---------------------------------------------------------------
  package:
    name: CD - Generar JAR
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: chmod +x mvnw

      - name: Empaquetar (las pruebas ya pasaron en el job anterior)
        run: ./mvnw -B -DskipTests package

      - name: Publicar el JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: inventario-jar
          path: target/inventario-*.jar
          if-no-files-found: error

  docker:
    name: CD - Imagen Docker
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: CD - Crear release en GitHub
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inventario-jar
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true

  # ---------------------------------------------------------------
  # DESPLIEGUE CONTINUO: solo si hay un hook configurado (ver README)
  # ---------------------------------------------------------------
  deploy:
    name: CD - Desplegar
    needs: [package, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Disparar el despliegue en Render
        if: env.DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Aviso - despliegue no configurado
        if: env.DEPLOY_HOOK == ''
        run: echo "::notice::Falta el secreto RENDER_DEPLOY_HOOK, se omite el despliegue. Ver README."
