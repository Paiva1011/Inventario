spring.application.name=inventario
server.port=${PORT:9090}

# Credenciales: se leen de variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# En local, crea application-local.properties (ignorado por git) con tu contraseña.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventario_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
